<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Catalog | Block Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

    :root {
      --terracota: #b95738;
      --terracota-escuro: #8f3d27;
      --oliva: #68734a;
      --creme: #f7f1e7;
      --papel: #fffdf8;
      --texto: #302820;
      --secundario: #786e62;
      --borda: #e8dccb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--texto);
      font-family: 'DM Sans', Arial, sans-serif;
      background:
        radial-gradient(ellipse at 10% 5%, rgba(185,87,56,.10), transparent 32%),
        radial-gradient(ellipse at 90% 20%, rgba(104,115,74,.10), transparent 30%),
        var(--creme);
    }

    .world-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .20;
      background-image: radial-gradient(#b99e7b 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    .topo {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 42px 20px 36px;
      text-align: left;
      color: #fffaf2;
      background:
        linear-gradient(90deg, rgba(43,35,27,.88), rgba(43,35,27,.68)),
        linear-gradient(135deg, #6c3828, #2f3929);
      border-bottom: 6px solid var(--terracota);
      overflow: hidden;
    }

    .topo::after {
      content: "✦  ✧  ✦";
      position: absolute;
      right: 7%;
      bottom: 8px;
      color: rgba(255,255,255,.16);
      font-size: 42px;
      letter-spacing: 18px;
      pointer-events: none;
    }

    .logo {
      font-size: 58px;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.28));
    }

    .topo h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.12;
      letter-spacing: .5px;
      color: #fffaf2;
    }

    .topo p {
      margin: 10px 0 0;
      color: #eadfce;
      font-size: 16px;
      letter-spacing: .3px;
    }

    .container {
      position: relative;
      width: min(1120px, calc(100% - 32px));
      margin: 34px auto;
    }

    .painel {
      background: rgba(255,253,248,.96);
      border: 1px solid var(--borda);
      border-top: 5px solid var(--terracota);
      border-radius: 15px;
      box-shadow: 0 14px 38px rgba(75,53,35,.09);
      padding: 28px;
    }

    h2 {
      margin: 0 0 23px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 3vw, 29px);
      line-height: 1.3;
      color: #49372b;
    }

    .bloco-icone { color: var(--terracota); margin-right: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 19px 22px; }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #4a3d32;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px 15px;
      color: var(--texto);
      background: #fff;
      border: 1px solid #d9cbbb;
      border-radius: 8px;
      outline: none;
      font: 15px 'DM Sans', Arial, sans-serif;
      transition: border-color .15s, box-shadow .15s;
    }

    select option { background: #fff; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--terracota);
      box-shadow: 0 0 0 3px rgba(185,87,56,.13);
    }
    input::placeholder, textarea::placeholder { color: #a79a8d; }
    textarea { resize: vertical; }
    .campo-largo { grid-column: 1 / -1; }

    .acoes {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 22px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: 700 15px 'DM Sans', Arial, sans-serif;
      color: #fffaf4;
      background: linear-gradient(135deg, var(--terracota), var(--terracota-escuro));
      padding: 14px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 0 #71301f, 0 8px 16px rgba(100,48,30,.16);
      transition: transform .12s, filter .12s;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #71301f; }
    button:disabled { opacity: .6; cursor: wait; }

    #mensagem { margin: 0; font-weight: 700; }
    .sucesso { color: #4f713d; }
    .erro { color: #b33d32; }

    .secao-restaurantes { margin-top: 42px; }
    .titulo-lista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .titulo-lista h2 { margin-bottom: 18px; }
    .botao-atualizar {
      padding: 11px 17px;
      margin-bottom: 18px;
      background: var(--oliva);
      box-shadow: 0 4px 0 #465033, 0 8px 16px rgba(55,65,38,.12);
    }
    .lista-restaurantes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      background: var(--papel);
      border: 1px solid var(--borda);
      border-radius: 13px;
      box-shadow: 0 8px 22px rgba(75,53,35,.08);
      transition: transform .18s, box-shadow .18s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 28px rgba(75,53,35,.13);
    }

    .card-imagem {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #e9dfd0;
      border-bottom: 1px solid var(--borda);
    }
    .card-imagem-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      font-size: 52px;
      background: linear-gradient(135deg, #ead9c4, #d8dfc9);
      border-bottom: 1px solid var(--borda);
    }
    .card-faixa { height: 4px; background: linear-gradient(90deg, var(--terracota), #d6a16c, var(--oliva)); }
    .card-conteudo { padding: 19px; }
    .card h3 {
      margin: 0 0 13px;
      color: #573727;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      overflow-wrap: anywhere;
    }
    .card p {
      margin: 8px 0;
      color: var(--secundario);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .card .descricao {
      padding-top: 11px;
      margin-top: 13px;
      border-top: 1px solid #eee4d8;
      color: #51463b;
    }
    .estado { color: var(--secundario); grid-column: 1 / -1; padding: 10px 0; }
    footer {
      position: relative;
      text-align: center;
      color: #77695b;
      padding: 25px 20px 30px;
      font-size: 13px;
      letter-spacing: .4px;
    }
    footer span { color: var(--terracota); padding: 0 6px; }

    @media (max-width: 650px) {
      .topo { flex-direction: column; text-align: center; gap: 8px; padding: 34px 18px; }
      .logo { font-size: 46px; }
      .topo::after { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .campo-largo { grid-column: auto; }
      .painel { padding: 19px; }
      .titulo-lista { align-items: flex-start; }
      .botao-atualizar { padding: 10px 13px; }
    }
  </style>
</head>
<body>
  <div class="world-overlay"></div>

  <header class="topo">
    <div class="logo">🍽️</div>
    <div>
      <h1>Sabores &amp; Lugares</h1>
      <p>Descubra bons sabores, lugares especiais e novas experiências.</p>
    </div>
  </header>

  <main class="container">
    <section class="painel cadastro">
      <h2><span class="bloco-icone">▦</span> Cadastrar novo restaurante</h2>

      <form id="formRestaurante">
        <div class="form-grid">
          <label>
            Nome do restaurante
            <input type="text" id="nome" placeholder="Ex.: Cantina da Praça" maxlength="120" required>
          </label>

          <label>
            Tipo de cozinha
            <input type="text" id="tipoCozinha" placeholder="Ex.: Italiana, Japonesa, Brasileira" maxlength="80" required>
          </label>

          <label>
            Endereço
            <input type="text" id="endereco" placeholder="Rua, número, bairro e cidade" maxlength="180" required>
          </label>

          <label>
            Telefone
            <input type="tel" id="telefone" placeholder="Ex.: (11) 99999-9999" maxlength="25">
          </label>

          <label>
            Faixa de preço
            <select id="faixaPreco" required>
              <option value="">Selecione uma faixa</option>
              <option value="$">$ — Econômico</option>
              <option value="$$">$$ — Moderado</option>
              <option value="$$$">$$$ — Alto</option>
              <option value="$$$$">$$$$ — Sofisticado</option>
            </select>
          </label>

          <label>
            URL da imagem
            <input type="url" id="imagem" placeholder="https://exemplo.com/restaurante.jpg">
          </label>

          <label class="campo-largo">
            Descrição
            <textarea id="descricao" rows="3" maxlength="600" placeholder="Descreva o restaurante, seus pratos ou diferenciais..."></textarea>
          </label>
        </div>

        <div class="acoes">
          <button type="submit" id="btnCadastrar">✚ Cadastrar restaurante</button>
          <p id="mensagem" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="secao-restaurantes">
      <div class="titulo-lista">
        <h2><span class="bloco-icone">▦</span> Restaurantes cadastrados</h2>
        <button type="button" class="botao-atualizar" id="btnAtualizar">↻ Atualizar</button>
      </div>
      <div id="listaRestaurantes" class="lista-restaurantes">
        <p class="estado">Carregando restaurantes...</p>
      </div>
    </section>
  </main>

  <footer>SABORES &amp; LUGARES <span>•</span> Cada refeição conta uma história.</footer>

  <script>
    // Ajuste o endereço caso sua API utilize outra URL.
    const API_URL = "http://localhost:8080/api/restaurantes";

    const formRestaurante = document.getElementById("formRestaurante");
    const listaRestaurantes = document.getElementById("listaRestaurantes");
    const mensagem = document.getElementById("mensagem");
    const btnCadastrar = document.getElementById("btnCadastrar");

    // GET: consulta os restaurantes cadastrados na API.
    async function listarRestaurantes() {
      listaRestaurantes.innerHTML = '<p class="estado">Buscando restaurantes na API...</p>';

      try {
        const resposta = await fetch(API_URL);
        if (!resposta.ok) throw new Error(`Erro HTTP: ${resposta.status}`);

        const restaurantes = await resposta.json();
        listaRestaurantes.innerHTML = "";

        if (!Array.isArray(restaurantes) || restaurantes.length === 0) {
          listaRestaurantes.innerHTML = '<p class="estado">Nenhum restaurante cadastrado ainda. Que tal adicionar o primeiro?</p>';
          return;
        }

        restaurantes.forEach((restaurante) => {
          const card = document.createElement("article");
          card.className = "card";

          let areaImagem;
          if (restaurante.imagem) {
            areaImagem = document.createElement("img");
            areaImagem.className = "card-imagem";
            areaImagem.src = restaurante.imagem;
            areaImagem.alt = `Foto do restaurante ${restaurante.nome ?? ""}`;
            areaImagem.loading = "lazy";
            areaImagem.onerror = () => {
              const placeholder = document.createElement("div");
              placeholder.className = "card-imagem-placeholder";
              placeholder.textContent = "🍽️";
              areaImagem.replaceWith(placeholder);
            };
          } else {
            areaImagem = document.createElement("div");
            areaImagem.className = "card-imagem-placeholder";
            areaImagem.textContent = "🍽️";
          }

          const faixa = document.createElement("div");
          faixa.className = "card-faixa";

          const conteudo = document.createElement("div");
          conteudo.className = "card-conteudo";

          const nome = document.createElement("h3");
          nome.textContent = `🍴 ${restaurante.nome ?? "Restaurante sem nome"}`;

          const cozinha = document.createElement("p");
          cozinha.textContent = `🥘 Cozinha: ${restaurante.tipoCozinha ?? "-"}`;

          const endereco = document.createElement("p");
          endereco.textContent = `📍 Endereço: ${restaurante.endereco ?? "-"}`;

          const telefone = document.createElement("p");
          telefone.textContent = `☎ Telefone: ${restaurante.telefone || "Não informado"}`;

          const preco = document.createElement("p");
          preco.textContent = `💲 Faixa de preço: ${restaurante.faixaPreco ?? "-"}`;

          const descricao = document.createElement("p");
          descricao.className = "descricao";
          descricao.textContent = restaurante.descricao || "Sem descrição cadastrada.";

          conteudo.append(nome, cozinha, endereco, telefone, preco, descricao);
          card.append(areaImagem, faixa, conteudo);
          listaRestaurantes.appendChild(card);
        });
      } catch (erro) {
        console.error("Erro ao buscar restaurantes:", erro);
        listaRestaurantes.innerHTML = '<p class="estado erro">Não foi possível carregar os restaurantes. Verifique se a API está em execução e se a rota está correta.</p>';
      }
    }

    // POST: envia os dados do formulário para a API.
    formRestaurante.addEventListener("submit", async (event) => {
      event.preventDefault();

      const restaurante = {
        nome: document.getElementById("nome").value.trim(),
        tipoCozinha: document.getElementById("tipoCozinha").value.trim(),
        endereco: document.getElementById("endereco").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        faixaPreco: document.getElementById("faixaPreco").value,
        imagem: document.getElementById("imagem").value.trim(),
        descricao: document.getElementById("descricao").value.trim()
      };

      mensagem.textContent = "Enviando cadastro...";
      mensagem.className = "";
      btnCadastrar.disabled = true;

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(restaurante)
        });

        if (!resposta.ok) {
          const detalhe = await resposta.text();
          throw new Error(detalhe || `Erro HTTP: ${resposta.status}`);
        }

        mensagem.textContent = "✔ Restaurante cadastrado com sucesso!";
        mensagem.className = "sucesso";
        formRestaurante.reset();
        await listarRestaurantes();
      } catch (erro) {
        console.error("Erro ao cadastrar restaurante:", erro);
        mensagem.textContent = "✖ Não foi possível cadastrar. Verifique os dados, a API e a rota.";
        mensagem.className = "erro";
      } finally {
        btnCadastrar.disabled = false;
      }
    });

    document.getElementById("btnAtualizar").addEventListener("click", listarRestaurantes);
    listarRestaurantes();
  </script>
</body>
</html>
